# climate_pipeline configuration — ALL paths and settings live here.
# Relative paths are resolved against this file's folder (climate_pipeline/).

paths:
  # External data (outside repo, read-only)
  authors_dictionaries: "D:/sem_iitk/sem9/thesis/old _work/code/jofi13219-sup-0002-replicationcode/Replication Files Sautner et al. (2023)/B. Figure 1 2, Table 2, and IA Table 6 7 8 9 11/bigrams"
  pdf_dir: "D:/sem_iitk/sem9/thesis/old _work/transcript"            # .pdf transcripts (pdfplumber)
  official_scores: "D:/sem_iitk/sem9/thesis/old _work/csv/firmyear_score_2024Q4_Version_2025_Jul_03.csv"
  transcript_dir: "D:/sem_iitk/sem9/thesis/api_transcripts"   # .txt transcripts read by the preprocess stage

  ticker_isin_map: "../ticker_isin_map.json"                         # repo root

  # Internal working folders
  data: "data"
  cache: "cache"
  outputs: "outputs"

settings:
  sample_mode: false      # overridden to true by `run.py --sample`
  sample_size: 200        # number of transcripts used in sample mode
  sample_seed: 42         # fixed seed for the firm-spread random sample
  chunk_size: 50000       # sentences per batch for chunked processing
  dictionary: authors     # authors | discovered
  pdf_ticker: XOM         # every PDF in pdf_dir is this firm (used only by --stage check_xom)
  pdf_isin: US30231G1022  # ISIN of pdf_ticker (matches official_scores)
  risk_list: curated      # Eq. 3 risk words: narrow | curated | lm_unc (see src/scoring.py)

# Authors' dictionary files inside paths.authors_dictionaries
dictionaries:
  cc: bigrams_07222021.pkl        # CCExposure
  op: opportunity_bigrams_4.pkl   # CCExposureOpp
  rg: regulatory_bigrams_4.pkl    # CCExposureReg
  ph: physical_bigrams_4.pkl      # CCExposurePhy

