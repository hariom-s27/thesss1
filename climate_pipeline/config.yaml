discovery:
  corpus: full            # full | sample. `--stage discover` uses this; `--stage discover --sample`
                          # always uses the 200-transcript scoring cache (quick test).
  n_workers: 6            # processes for lemmatizing the full corpus (cache/discovery/sentences_full.parquet)
  min_df: 3               # classifier features: bigrams in >= 3 training sentences
  # Training set = all of R + |S_train| random S sentences, with
  # |S_train| = min(round(s_train_ratio * |R|), |S|, s_train_max). The paper's R ~ 60k and
  # S sample = 100k; the 100k is a corpus-size artefact, the RATIO is what we keep.
  s_train_ratio: 1.667    # = 100,000 / 60,000 from the paper (R ~ 37.5% of the training set)
  s_train_max: 100000
  oof_folds: 5            # S_train sentences are scored out-of-fold (cross_val_predict, k folds)
  t_threshold: 0.8        # T = S sentences with max(P_nb, P_svc, P_rf) > t_threshold
  # Task 2.4 ranking (src/discovery/rank.py)
  min_t_only_df: 3        # T-only bigrams kept if in >= 3 T sentences (paper keeps all T-only, but
                          # had already dropped bigrams with frequency < 10 at preprocessing)
  top_pct: 0.05           # shared bigrams with prop_T > prop_ST: keep the top 5% by King score

  # ---- Task 3.1: rough library, set M, candidate filters (src/discovery/rough_library.py) ----
  use_rough_library: false     # true -> M = sentences with >= 1 rough bigram (paper, IA I steps 1-2);
                               # false -> PROTOTYPE, M = all sentences (variant A)
  rough_min_freq: 10           # C_R: IPCC bigrams with total frequency >= this
  n_min_freq: 2                # N: normal-text bigrams with total frequency >= this
  n_corpora: [gutenberg, reuters, brown]   # NLTK corpora used as "normal text" N
  rough_clean: true            # true -> cleaned rough library (task 3.1b, rough_bigrams_clean.pkl);
                               # false -> the task-3.1 library (rough_bigrams.pkl, variants B/C/D)
  rough_cleaning:              # rough library only; never applied to transcripts or scoring
    drop_citation_lines: true  # drop PDF lines with et al / doi / http / ISBN / author-year citations
    drop_digits: true          # remove digit-only tokens before forming IPCC bigrams (paper IA I)
    token_validity: true       # OUR ADDITION: both words in N unigram vocab OR >= min_transcript_count
    min_transcript_count: 5    #   times in the transcript corpus (drops names, garbled PDF text)
  rough_n_workers: 6           # processes for lemmatizing IPCC + N (results do not depend on it)
  ipcc_extract_workers: 2      # processes for PDF text extraction
  ipcc_extractor: pymupdf      # engine for pages NOT yet extracted (pdfplumber | pymupdf). Pages already
                               # in cache keep their engine. pdfplumber needed >5 GB per worker and
                               # ~10 s per page on AR5 WG1, so the last ~2,100 pages use PyMuPDF.
  filter_candidates_by_N: false  # N2: drop candidate bigrams in N before ranking. OUR
                               # INTERPRETATION for a small corpus (the paper uses N only for the
                               # rough library)
  min_firms_in_T: 3            # F: keep a candidate only if its T sentences come from >= this many
                               # distinct tickers (0/1 = off). DEVIATION for a 21-firm corpus.
                               # Only used when apply_firm_filter is true.
  apply_firm_filter: false
  # Evaluation (stage discover_variants)
  vocab_shift_year: 2021       # vocabulary-shift check: T occurrences before vs from this year
  vocab_shift_min_nkT: 10      # only bigrams with >= this many T sentences are listed
  vocab_shift_min_firms: 3     # ... and with T sentences from >= this many tickers (drops exec names)
  best_variant: auto           # auto = highest spearman_gain_vs_seeds (Spearman vs official minus
                               # the seeds-only S0 Spearman); or a variant name
  best_min_discovered: 100     # auto only considers variants with >= this many discovered bigrams
                               # (the human-check sheet has 100 rows)

# Stage `discover_variants`: each variant overrides these discovery keys, then runs 2.2-2.6.
# Variants that share the M definition share the classifier run (cached per M).
discovery_variants:
  S0: {seeds_only: true}   # baseline: dictionary = the 50 seeds, no discovery (paper Figure 2 logic)
  A:  {use_rough_library: false, filter_candidates_by_N: false, apply_firm_filter: false}  # prototype
  B:  {use_rough_library: true, rough_clean: false, filter_candidates_by_N: false, apply_firm_filter: false}  # 3.1 rough library
  C:  {use_rough_library: true, rough_clean: false, filter_candidates_by_N: true,  apply_firm_filter: false}  # B + N2
  D:  {use_rough_library: true, rough_clean: false, filter_candidates_by_N: true,  apply_firm_filter: true}   # C + F
  B2: {use_rough_library: true, rough_clean: true,  filter_candidates_by_N: false, apply_firm_filter: false}  # cleaned rough library
  C2: {use_rough_library: true, rough_clean: true,  filter_candidates_by_N: true,  apply_firm_filter: false}  # B2 + N2
  D2: {use_rough_library: true, rough_clean: true,  filter_candidates_by_N: true,  apply_firm_filter: true}   # C2 + F
